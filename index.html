<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador 3D - Borgonha Rosé</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle, #2d2f34 0%, #111215 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 1px;
      pointer-events: none;
    }
    #instrucoes {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading">Renderizando garrafa e rosé...</div>
  <div id="instrucoes">Girar: Botão esquerdo • Zoom: Scroll • Mover: Botão direito</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

    // 1. Cena e Câmera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.2, 3.2);

    // 2. Renderizador
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    document.body.appendChild(renderer.domElement);

    // 3. Controles
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 4. Iluminação de Estúdio para Líquido Rosé
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(4, 5, 4);
    scene.add(keyLight);

    const backLight = new THREE.DirectionalLight(0xffc5cc, 2.0); // Luz traseira para acentuar o líquido rosé
    backLight.position.set(0, 2, -4);
    scene.add(backLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 1.2);
    fillLight.position.set(-4, 0, 3);
    scene.add(fillLight);

    // 5. Material de Vidro Rosé Translúcido
    const roseGlassMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xf5989d),       // Tom rosé delicado
      transmission: 0.88,                     // Semi-transparente
      opacity: 1.0,
      transparent: true,
      roughness: 0.04,
      ior: 1.48,
      thickness: 0.6,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05
    });

    // 6. Textura com Orientação Ajustada
    const textureLoader = new THREE.TextureLoader();
    const labelTexture = textureLoader.load('rotulo.png');
    labelTexture.colorSpace = THREE.SRGBColorSpace;
    labelTexture.wrapS = THREE.RepeatWrapping;
    labelTexture.wrapT = THREE.ClampToEdgeWrapping;

    // --- CONTROLES DE ORIENTAÇÃO DA TEXTURA ---
    // Gira a textura em torno do centro caso ela venha em pé
    labelTexture.center.set(0.5, 0.5);
    labelTexture.rotation = 0; // Se estiver 90° de lado, mude para: Math.PI / 2
    labelTexture.repeat.set(-1, 1); // Espelha horizontalmente (-1) para corrigir texto invertido no cilindro

    const labelMaterial = new THREE.MeshBasicMaterial({
      map: labelTexture,
      transparent: true,
      alphaTest: 0.02,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const loadingEl = document.getElementById('loading');

    // 7. Carregamento e Posicionamento do Rótulo na Base da Garrafa
    const loader = new OBJLoader();
    loader.load(
      'garrafa.obj',
      (obj) => {
        obj.traverse((child) => {
          if (child.isMesh) {
            child.material = roseGlassMaterial;
          }
        });

        // Escala normalizada (1.8m de altura)
        const box = new THREE.Box3().setFromObject(obj);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const escala = 1.8 / Math.max(size.x, size.y, size.z);
        obj.scale.set(escala, escala, escala);

        // Centralização
        box.setFromObject(obj);
        box.getCenter(center);
        obj.position.x -= center.x;
        obj.position.y -= center.y;
        obj.position.z -= center.z;

        // Dimensões finais da garrafa
        const finalBox = new THREE.Box3().setFromObject(obj);
        const finalSize = finalBox.getSize(new THREE.Vector3());

        const raioBase = (finalSize.x / 2) * 1.015; // 1.5% maior para contornar o vidro perfeitamente
        const alturaRotulo = finalSize.y * 0.28;     // Faixa inferior correspondente ao corpo cilíndrico

        // Cilindro envolvente 360°
        const labelGeometry = new THREE.CylinderGeometry(
          raioBase,
          raioBase,
          alturaRotulo,
          64,
          1,
          true
        );

        const labelMesh = new THREE.Mesh(labelGeometry, labelMaterial);

        // Posiciona no terço inferior (rente à base da borgonha)
        labelMesh.position.y = finalBox.min.y + (alturaRotulo / 2) + 0.04;

        // Alinha a costura do rótulo para trás, deixando a frente voltada para a câmera
        labelMesh.rotation.y = Math.PI;

        obj.add(labelMesh);
        scene.add(obj);

        loadingEl.style.display = 'none';
      },
      undefined,
      (err) => {
        console.error(err);
        loadingEl.innerText = 'Erro ao carregar garrafa.obj';
      }
    );

    // 8. Responsividade
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 9. Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

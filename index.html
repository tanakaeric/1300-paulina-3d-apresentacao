<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador 3D - Borgonha Rosé</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle, #2d2f34 0%, #111215 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 1px;
      pointer-events: none;
    }
    #instrucoes {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading">Carregando garrafa...</div>
  <div id="instrucoes">Girar: Botão esquerdo • Zoom: Scroll • Mover: Botão direito</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. Cena e Câmera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 3.2);

    // 2. Renderizador WebGL
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.body.appendChild(renderer.domElement);

    // 3. Controles
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 4. Luzes de Estúdio
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(5, 5, 5);
    scene.add(keyLight);

    const backLight = new THREE.DirectionalLight(0xffd5dc, 1.8);
    backLight.position.set(0, 2, -4);
    scene.add(backLight);

    // 5. Material Físico Rosé Translúcido
    const roseGlassMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xf68b98),
      transparent: true,
      opacity: 0.68,
      roughness: 0.05,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      ior: 1.5,
      side: THREE.DoubleSide
    });

    // 6. Rótulo Envolvente
    const textureLoader = new THREE.TextureLoader();
    const labelTexture = textureLoader.load('rotulo.png');
    labelTexture.colorSpace = THREE.SRGBColorSpace;

    const labelMaterial = new THREE.MeshStandardMaterial({
      map: labelTexture,
      transparent: true,
      alphaTest: 0.02,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const loadingEl = document.getElementById('loading');

    // 7. Carregador GLB
    const loader = new GLTFLoader();
    loader.load(
      'garrafa.glb',
      (gltf) => {
        const model = gltf.scene;

        model.traverse((child) => {
          if (child.isMesh) {
            child.material = roseGlassMaterial;
          }
        });

        // Escala normalizada para 1.8 unidades
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const escala = 1.8 / Math.max(size.x, size.y, size.z);
        model.scale.set(escala, escala, escala);

        box.setFromObject(model);
        box.getCenter(center);
        model.position.x -= center.x;
        model.position.y -= center.y;
        model.position.z -= center.z;

        const finalBox = new THREE.Box3().setFromObject(model);
        const finalSize = finalBox.getSize(new THREE.Vector3());

        // Cilindro do Rótulo na base cilíndrica da garrafa
        const raio = (finalSize.x / 2) * 1.012;
        const altura = finalSize.y * 0.28;

        const labelGeo = new THREE.CylinderGeometry(raio, raio, altura, 64, 1, true);
        
        // Corrige a orientação horizontal para o texto não ficar espelhado
        const uvs = labelGeo.attributes.uv;
        for (let i = 0; i < uvs.count; i++) {
          uvs.setX(i, 1.0 - uvs.getX(i));
        }
        uvs.needsUpdate = true;

        const labelMesh = new THREE.Mesh(labelGeo, labelMaterial);
        labelMesh.position.y = finalBox.min.y + (altura / 2) + 0.05;
        labelMesh.rotation.y = -Math.PI / 2;

        model.add(labelMesh);
        scene.add(model);

        loadingEl.style.display = 'none';
      },
      undefined,
      (err) => {
        console.error('Falha ao carregar garrafa.glb:', err);
        loadingEl.innerText = 'Erro ao ler garrafa.glb. Abra o Console (F12) para detalhes.';
      }
    );

    // 8. Responsividade
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 9. Loop de animação
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

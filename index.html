<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador 3D - Borgonha Rosé</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle, #2d2f34 0%, #111215 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 1px;
      pointer-events: none;
    }
    #instrucoes {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading">Renderizando garrafa, rótulo e tampa...</div>
  <div id="instrucoes">Girar: Botão esquerdo • Zoom: Scroll • Mover: Botão direito</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    // 1. Cena e Câmera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.1, 3.2);

    // 2. Renderizador com suporte à alta densidade de pixels
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    document.body.appendChild(renderer.domElement);

    // 3. Controles
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 4. Iluminação Balanceada
    scene.add(new THREE.AmbientLight(0xffffff, 1.3));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(5, 5, 5);
    scene.add(keyLight);

    const backLight = new THREE.DirectionalLight(0xffe4d6, 1.9);
    backLight.position.set(0, 2, -4);
    scene.add(backLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 1.2);
    fillLight.position.set(-5, 3, -2);
    scene.add(fillLight);

    // 5. Material de Vidro Rosé Pêssego Translúcido
    const peachGlassMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xf29377),
      transparent: true,
      opacity: 0.70,
      roughness: 0.04,
      metalness: 0.02,
      clearcoat: 1.0,
      clearcoatRoughness: 0.04,
      ior: 1.5,
      side: THREE.DoubleSide
    });

    // 6. Material de Alumínio Calibrado para Iluminação de Estúdio
    const aluminumCapMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(0xf29377), // Alumínio claro iluminado
      metalness: 0.35,                  // Permite leitura clara do relevo sem escurecer
      roughness: 0.25,                  // Acabamento acetinado escovado
      side: THREE.DoubleSide
    });

    // 7. Textura do Rótulo em Alta Resolução
    const textureLoader = new THREE.TextureLoader();
    const labelTexture = textureLoader.load('rotulo.png');
    labelTexture.colorSpace = THREE.SRGBColorSpace;
    labelTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    labelTexture.minFilter = THREE.LinearMipmapLinearFilter;
    labelTexture.magFilter = THREE.LinearFilter;

    const labelMaterial = new THREE.MeshBasicMaterial({
      map: labelTexture,
      transparent: true,
      alphaTest: 0.02,
      side: THREE.FrontSide,
      depthWrite: false,
      polygonOffset: true,       // Força o rótulo a renderizar na frente
      polygonOffsetFactor: -1,   // Puxa a camada visualmente para fora
      polygonOffsetUnits: -1
    });

    const loadingEl = document.getElementById('loading');

    // 8. Carregador GLB com Meshopt
    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);

    loader.load(
      'garrafa.glb',
      (gltf) => {
        const model = gltf.scene;

        // Aplica o vidro rosé
        model.traverse((child) => {
          if (child.isMesh) {
            child.material = peachGlassMaterial;
          }
        });

        // Dimensões nativas da garrafa
        const nativeBox = new THREE.Box3().setFromObject(model);
        const nativeSize = nativeBox.getSize(new THREE.Vector3());
        const nativeCenter = nativeBox.getCenter(new THREE.Vector3());

        // --- A. RÓTULO NA BASE ---
        const raioBaseNativo = (nativeSize.x / 2) * 1.0008;
        const alturaRotuloNativa = nativeSize.y * 0.28;

        const labelGeometry = new THREE.CylinderGeometry(
          raioBaseNativo,
          raioBaseNativo,
          alturaRotuloNativa,
          64,
          1,
          true
        );

        const labelMesh = new THREE.Mesh(labelGeometry, labelMaterial);
        labelMesh.position.set(
          nativeCenter.x,
          nativeBox.min.y + (alturaRotuloNativa / 2) + (nativeSize.y * 0.04),
          nativeCenter.z
        );
        labelMesh.rotation.y = Math.PI;
        model.add(labelMesh);

        // --- B. CÁPSULA / TAMPA DE ALUMÍNIO NO GARGALO ---
        // Proporção de gargalo para garrafas Borgonha da Tripo (~42% do raio do bojo)
        const proporcaoRaioGargalo = 0.35; 
        const raioGargalo = (nativeSize.x / 2) * proporcaoRaioGargalo;
        const alturaTampa = nativeSize.y * 0.22;

        const capGeometry = new THREE.CylinderGeometry(
          raioGargalo,
          raioGargalo * 1.02, // Leve cone para vestir perfeitamente a boca da garrafa
          alturaTampa,
          64,
          1,
          false // Fechada no topo com tampa de metal
        );

        const capMesh = new THREE.Mesh(capGeometry, aluminumCapMaterial);
        
        // Posicionamento no topo exato da garrafa
        capMesh.position.set(
          nativeCenter.x,
          nativeBox.max.y - (alturaTampa / 2) + (nativeSize.y * 0.005),
          nativeCenter.z
        );
        model.add(capMesh);

        // --- C. NORMALIZAÇÃO DE ESCALA ---
        const totalBox = new THREE.Box3().setFromObject(model);
        const totalSize = totalBox.getSize(new THREE.Vector3());
        const totalCenter = totalBox.getCenter(new THREE.Vector3());

        const targetHeight = 1.8;
        const scaleFactor = targetHeight / Math.max(totalSize.x, totalSize.y, totalSize.z);
        model.scale.setScalar(scaleFactor);

        model.position.x = -totalCenter.x * scaleFactor;
        model.position.y = -totalCenter.y * scaleFactor;
        model.position.z = -totalCenter.z * scaleFactor;

        scene.add(model);
        loadingEl.style.display = 'none';
      },
      undefined,
      (err) => {
        console.error('Falha ao carregar garrafa.glb:', err);
        loadingEl.innerText = 'Erro ao ler garrafa.glb. Verifique o console.';
      }
    );

    // 9. Responsividade
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 10. Loop contínuo
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador 3D - Borgonha Rosé</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle, #2d2f34 0%, #111215 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 1px;
      pointer-events: none;
    }
    #instrucoes {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading">Carregando garrafa e rótulo...</div>
  <div id="instrucoes">Girar: Botão esquerdo • Zoom: Scroll • Mover: Botão direito</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. Cena e Câmera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 3.2);

    // 2. Renderizador WebGL
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.body.appendChild(renderer.domElement);

    // 3. Controles
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 4. Iluminação
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(5, 5, 5);
    scene.add(keyLight);

    const backLight = new THREE.DirectionalLight(0xffd5dc, 1.8);
    backLight.position.set(0, 2, -4);
    scene.add(backLight);

    // 5. Material Físico Rosé Translúcido
    const roseGlassMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xf68b98),
      transparent: true,
      opacity: 0.70,
      roughness: 0.05,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      ior: 1.5,
      side: THREE.DoubleSide
    });

    // 6. Textura do Rótulo
    const textureLoader = new THREE.TextureLoader();
    const labelTexture = textureLoader.load('rotulo.png');
    labelTexture.colorSpace = THREE.SRGBColorSpace;

    const labelMaterial = new THREE.MeshBasicMaterial({
      map: labelTexture,
      transparent: true,
      alphaTest: 0.02,
      side: THREE.FrontSide, // Renderiza exclusivamente para fora
      depthWrite: false
    });

    const loadingEl = document.getElementById('loading');

    // 7. Carregamento do GLB
    const loader = new GLTFLoader();
    loader.load(
      'garrafa.glb',
      (gltf) => {
        const model = gltf.scene;

        // Aplica o material rosé em todas as partes da garrafa
        model.traverse((child) => {
          if (child.isMesh) {
            child.material = roseGlassMaterial;
          }
        });

        // PASSO 1: Medir a garrafa nas dimensões NATIVAS do arquivo original
        const nativeBox = new THREE.Box3().setFromObject(model);
        const nativeSize = nativeBox.getSize(new THREE.Vector3());
        const nativeCenter = nativeBox.getCenter(new THREE.Vector3());

        // Raio e altura calculados exatamente na escala nativa do arquivo
        const raioNativo = (nativeSize.x / 2) * 1.012; // 1.2% maior para envelopar sem colisão
        const alturaRotuloNativa = nativeSize.y * 0.28;

        // PASSO 2: Criar o cilindro 360° COM AS MEDIDAS NATIVAS
        const labelGeometry = new THREE.CylinderGeometry(
          raioNativo,
          raioNativo,
          alturaRotuloNativa,
          64,
          1,
          true
        );

        // CORREÇÃO DEFINITIVA DO TEXTO INVERTIDO:
        // Espelha o eixo U dos vértices para a leitura ser 100% da esquerda para a direita
        const uvs = labelGeometry.attributes.uv;
        for (let i = 0; i < uvs.count; i++) {
          uvs.setX(i, 1.0 - uvs.getX(i));
        }
        uvs.needsUpdate = true;

        const labelMesh = new THREE.Mesh(labelGeometry, labelMaterial);

        // Posiciona o rótulo na base da garrafa ainda nas coordenadas nativas
        labelMesh.position.set(
          nativeCenter.x,
          nativeBox.min.y + (alturaRotuloNativa / 2) + (nativeSize.y * 0.03),
          nativeCenter.z
        );

        // Gira o cilindro para alinhar a frente do design diretamente para a câmera
        labelMesh.rotation.y = -Math.PI / 2;

        // PASSO 3: VINCULAR O RÓTULO COMO FILHO DO MODELO
        // Isso garante que qualquer escala aplicada à garrafa afete o rótulo junto
        model.add(labelMesh);

        // PASSO 4: NORMALIZAR O CONJUNTO INTEIRO PARA CABER NA TELA
        const totalBox = new THREE.Box3().setFromObject(model);
        const totalSize = totalBox.getSize(new THREE.Vector3());
        const totalCenter = totalBox.getCenter(new THREE.Vector3());

        const targetHeight = 1.8;
        const scaleFactor = targetHeight / Math.max(totalSize.x, totalSize.y, totalSize.z);
        model.scale.setScalar(scaleFactor);

        // Centraliza o conjunto perfeitamente na origem
        model.position.x = -totalCenter.x * scaleFactor;
        model.position.y = -totalCenter.y * scaleFactor;
        model.position.z = -totalCenter.z * scaleFactor;

        scene.add(model);
        loadingEl.style.display = 'none';
      },
      undefined,
      (err) => {
        console.error('Falha ao carregar garrafa.glb:', err);
        loadingEl.innerText = 'Erro ao ler garrafa.glb. Verifique o console.';
      }
    );

    // 8. Responsividade
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 9. Loop de animação contínua
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

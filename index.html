<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador 3D - Garrafa</title>
  <style>
    body { margin: 0; overflow: hidden; background: radial-gradient(circle, #2c2d30 0%, #111215 100%); font-family: sans-serif; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 1.1rem; pointer-events: none; }
    #instrucoes { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.6); font-size: 0.85rem; background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 20px; pointer-events: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading">Carregando garrafa 3D...</div>
  <div id="instrucoes">Clique e arraste para girar • Scroll para zoom • Botão direito para mover</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Carregamento do arquivo OBJ
    const loader = new OBJLoader();
    const loadingEl = document.getElementById('loading');

    loader.load(
      'garrafa.obj',
      (object) => {
        // Aplica material básico caso o OBJ venha sem texturas vinculadas
        object.traverse((child) => {
          if (child.isMesh && !child.material) {
            child.material = new THREE.MeshStandardMaterial({
              color: 0x2e6f40, // Tom esverdeado para vidro
              roughness: 0.2,
              metalness: 0.1
            });
          }
        });

        // Centralização do modelo
        const box = new THREE.Box3().setFromObject(object);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        object.position.x += (object.position.x - center.x);
        object.position.y += (object.position.y - center.y);
        object.position.z += (object.position.z - center.z);

        const maxDim = Math.max(size.x, size.y, size.z);
        camera.position.z = maxDim * 2.2;
        camera.lookAt(0, 0, 0);

        scene.add(object);
        loadingEl.style.display = 'none';
      },
      undefined,
      (error) => {
        console.error(error);
        loadingEl.innerText = 'Erro ao carregar o arquivo .obj.';
      }
    );

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador 3D - Garrafa Borgonha Rosé</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle, #2d2f34 0%, #111215 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 1rem;
      letter-spacing: 1px;
      pointer-events: none;
    }
    #instrucoes {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="loading">Carregando garrafa e rótulo...</div>
  <div id="instrucoes">Girar: Botão esquerdo • Zoom: Scroll • Mover: Botão direito</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. Cena e Câmera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 3.2);

    // 2. Renderizador
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.body.appendChild(renderer.domElement);

    // 3. Controles
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 4. Luzes de Estúdio para destacar o rosé
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(5, 5, 5);
    scene.add(keyLight);

    const backLight = new THREE.DirectionalLight(0xffd5dc, 1.8);
    backLight.position.set(0, 2, -4);
    scene.add(backLight);

    // 5. Material Físico Rosé Translúcido
    const roseGlassMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xf68b98),       // Tom rosé translúcido
      transparent: true,
      opacity: 0.70,
      roughness: 0.05,
      metalness: 0.05,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      ior: 1.5,
      side: THREE.DoubleSide
    });

    // 6. Textura do Rótulo
    const textureLoader = new THREE.TextureLoader();
    const labelTexture = textureLoader.load('rotulo.png');
    labelTexture.colorSpace = THREE.SRGBColorSpace;

    const labelMaterial = new THREE.MeshBasicMaterial({
      map: labelTexture,
      transparent: true,
      alphaTest: 0.02,
      side: THREE.FrontSide, // Renderiza na face externa voltada para fora
      depthWrite: false
    });

    const loadingEl = document.getElementById('loading');

    // 7. Carregamento da Garrafa do Sketchfab
    const loader = new GLTFLoader();
    loader.load(
      'garrafa.glb',
      (gltf) => {
        const model = gltf.scene;

        // Aplica o vidro rosé
        model.traverse((child) => {
          if (child.isMesh) {
            child.material = roseGlassMaterial;
          }
        });

        // 1º PASSO: Normalizar a escala e centralizar no mundo
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const targetHeight = 1.8;
        const scale = targetHeight / Math.max(size.x, size.y, size.z);
        model.scale.set(scale, scale, scale);

        // Recalcula o centro após aplicar a escala
        model.position.x = -center.x * scale;
        model.position.y = -center.y * scale;
        model.position.z = -center.z * scale;

        // Container para encapsular a garrafa e o rótulo perfeitamente alinhados
        const container = new THREE.Group();
        container.add(model);

        // 2º PASSO: Medir as dimensões exatas escaladas
        const scaledBox = new THREE.Box3().setFromObject(container);
        const scaledSize = scaledBox.getSize(new THREE.Vector3());

        // Raio da base cilíndrica da garrafa
        const radius = (scaledSize.x / 2) * 1.015; // 1.5% maior para contornar o vidro perfeitamente
        const labelHeight = scaledSize.y * 0.28;   // Faixa horizontal envolvente (terço inferior)

        // Geometria cilíndrica 360°
        const labelGeometry = new THREE.CylinderGeometry(
          radius,
          radius,
          labelHeight,
          64,
          1,
          true
        );

        // CORREÇÃO DO RÓTULO INVERTIDO / DO AVESSO:
        // Ajusta as coordenadas UV para que o texto leia da esquerda para a direita na face externa
        const uvs = labelGeometry.attributes.uv;
        for (let i = 0; i < uvs.count; i++) {
          uvs.setX(i, 1.0 - uvs.getX(i));
        }
        uvs.needsUpdate = true;

        const labelMesh = new THREE.Mesh(labelGeometry, labelMaterial);

        // Posiciona no terço inferior (corpo reto da garrafa Borgonha)
        labelMesh.position.y = scaledBox.min.y + (labelHeight / 2) + 0.05;

        // Alinha a frente do rótulo para a câmera
        labelMesh.rotation.y = Math.PI / 2;

        container.add(labelMesh);
        scene.add(container);

        loadingEl.style.display = 'none';
      },
      undefined,
      (err) => {
        console.error('Falha ao carregar garrafa.glb:', err);
        loadingEl.innerText = 'Erro ao ler garrafa.glb. Verifique o console.';
      }
    );

    // 8. Responsividade
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 9. Loop contínuo
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

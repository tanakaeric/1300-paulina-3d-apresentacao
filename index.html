<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador 3D - Garrafa Borgonha</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle, #2b2d30 0%, #111215 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    #instrucoes {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.82rem;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>
  <!-- Engine 3D oficial do Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <model-viewer
    id="viewer"
    src="garrafa.glb"
    camera-controls
    touch-action="pan-y"
    interaction-prompt="auto"
    shadow-intensity="1.5"
    exposure="1.2"
    camera-orbit="0deg 85deg auto"
    min-camera-orbit="auto auto 5%"
    max-camera-orbit="auto auto 200%">
  </model-viewer>

  <div id="instrucoes">Girar: Clique e arraste • Zoom: Scroll / Pinça</div>

  <script type="module">
    const viewer = document.querySelector('#viewer');

    viewer.addEventListener('load', async () => {
      // 1. Acessa os materiais do modelo
      const material = viewer.model.materials[0];

      if (material) {
        // 2. Configura vidro Borgonha translúcido
        material.pbrMetallicRoughness.setBaseColorFactor([1.0, 1.0, 1.0, 1.0]);
        material.pbrMetallicRoughness.setRoughnessFactor(0.05);
        material.pbrMetallicRoughness.setMetallicFactor(0.0);

        if (material.transmission) {
          material.transmission.setTransmissionFactor(0.95);
          material.ior.setIOR(1.52);
        }

        // 3. Aplica a serigrafia/rótulo transparente
        try {
          const texture = await viewer.createTexture('rotulo.png');
          material.pbrMetallicRoughness.baseColorTexture.setTexture(texture);
          material.setAlphaMode('BLEND'); // Garante a transparência do fundo do PNG
        } catch (e) {
          console.warn('rotulo.png não encontrado ou erro ao carregar:', e);
        }
      }
    });
  </script>
</body>
</html>
